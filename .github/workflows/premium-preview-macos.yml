name: macOS Premium Preview
on:
  pull_request:
    paths:
      - '.github/workflows/premium-preview-macos.yml'
      - 'cmake/PremiumPreview.cmake'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'experiments/premium_filter/**'
      - 'experiments/oscillator/**'
      - 'tests/oscillator_dispatch_engine.cpp'
      - 'tests/premium_preview.cpp'
      - 'tests/premium_preview_levels.cpp'
      - 'tests/premium_preview_package.py'
      - 'scripts/package-premium-preview.py'
      - 'scripts/validate-plugin.py'
      - 'docs/PREMIUM_PREVIEW.md'
      - 'docs/NATIVE_PREVIEW_PAIR_QUALIFICATION.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: premium-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    name: Universal / ${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: reference
            candidate: 'OFF'
            product: SAWSTARPremiumPreview
            artifact: SAWSTAR-Premium-Preview
          - role: candidate
            candidate: 'ON'
            product: SAWSTARPremiumCandidate
            artifact: SAWSTAR-Premium-Candidate
    runs-on: macos-14
    timeout-minutes: 35
    env:
      SAWSTAR_MAC_ARCHS: 'arm64;x86_64'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned plugin dependencies
        run: python3 scripts/bootstrap-plugin.py
      - name: Test preview package isolation
        run: python3 tests/premium_preview_package.py
      - name: Configure separate Universal preview
        run: cmake -S . -B build-premium -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DSAWSTAR_BUILD_PLUGIN=ON -DSAWSTAR_PREMIUM_PREVIEW=ON -DSAWSTAR_PREMIUM_NATIVE_CANDIDATE=${{ matrix.candidate }} '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DIPLUG_DEPLOY_PLUGINS=OFF
      - name: Build preview and engine smoke
        run: cmake --build build-premium --config Release --target ${{ matrix.product }}-vst3 sawstar_premium_preview_smoke sawstar_premium_preview_levels sawstar_premium_native_pair --parallel 3
      - name: Qualify calibrated Preview reference and dispatch candidate on both slices
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, platform, shutil, subprocess, sys
          from pathlib import Path
          if platform.system() != 'Darwin' or platform.machine() != 'arm64':
              raise SystemExit('Expected Apple Silicon for explicit arm64/Rosetta qualification')
          output = Path('preview-qualification')
          output.mkdir(exist_ok=False)
          executable = Path('build-premium/sawstar_premium_native_pair').resolve()
          shutil.copy2(executable, output/executable.name)
          shutil.copy2('build-premium/CMakeCache.txt', output/'CMakeCache.txt')
          manifest = dict(schema=1, state='incomplete',
              source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              executable_sha256=hashlib.sha256(executable.read_bytes()).hexdigest(),
              cmake_cache_sha256=hashlib.sha256((output/'CMakeCache.txt').read_bytes()).hexdigest(),
              runtime_platform=platform.platform(),
              purpose='bit identity qualification; not CPU measurement or native host acceptance',
              native_host_acceptance=False, production_promotion_allowed=False, results=[])
          def save():
              (output/'manifest.json').write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')
          save()
          try:
              # Each slice/waveform runs exactly once. A failed stream remains failed;
              # the other planned streams still produce diagnostics, never a retry.
              for wave in range(4):
                  for arch_name in ('arm64', 'x86_64'):
                      log = output/(arch_name+'-waveform-'+str(wave)+'.txt')
                      with log.open('w', encoding='utf-8') as stream:
                          result = subprocess.run(['arch', '-'+arch_name, str(executable),
                              '--waveform', str(wave)], stdout=stream, stderr=subprocess.STDOUT)
                      manifest['results'].append(dict(waveform=wave, architecture=arch_name,
                          translated=arch_name=='x86_64', returncode=result.returncode,
                          log_sha256=hashlib.sha256(log.read_bytes()).hexdigest()))
                      save()
                      print(arch_name, 'waveform', wave, 'exit', result.returncode, flush=True)
              manifest['state'] = 'failed' if any(r['returncode'] for r in manifest['results']) else 'complete'
          except BaseException as error:
              manifest['state']='failed'; manifest['error']=str(error)
              raise
          finally:
              save()
          if manifest['state'] != 'complete':
              raise SystemExit('Calibrated pair failed; inspect preserved per-slice logs')
          PYCODE
      - name: Preserve exact-head numerical qualification including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}-numerical-qualification
          path: preview-qualification/
          if-no-files-found: warn
          retention-days: 90
      - name: Check engine identity, audio and latency on both slices
        run: |
          build-premium/sawstar_premium_preview_smoke
          arch -x86_64 build-premium/sawstar_premium_preview_smoke
          lipo build-premium/out/${{ matrix.product }}.vst3/Contents/MacOS/${{ matrix.product }} -verify_arch arm64 x86_64
          codesign --force --deep --sign - build-premium/out/${{ matrix.product }}.vst3
      - name: Check reference factory headroom and calibration on both slices
        run: |
          build-premium/sawstar_premium_preview_levels > premium-levels-arm64.csv
          arch -x86_64 build-premium/sawstar_premium_preview_levels > premium-levels-x86_64.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.artifact }}-reference-level-measurements
          path: premium-levels-*.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Validate actual preview VST3 on both slices
        run: python3 scripts/validate-plugin.py --bundle build-premium/out/${{ matrix.product }}.vst3
      - name: Package the validated experimental preview
        run: |
          python3 scripts/package-premium-preview.py build-premium/out/${{ matrix.product }}.vst3 ${{ matrix.artifact }}-macOS-Universal.zip --role ${{ matrix.role }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}-macOS-Universal
          path: |
            ${{ matrix.artifact }}-macOS-Universal.zip
            ${{ matrix.artifact }}-macOS-Universal.zip.sha256
          if-no-files-found: error
          retention-days: 30
