name: K1 setup FP localization
on:
  pull_request:
    paths:
      - '.github/workflows/k1-setup-fp.yml'
      - 'tests/k1_setup_fp.cpp'
      - 'tests/DispatchEngineSetup.h'
      - 'tests/FpObservation.h'
      - 'tests/oscillator_dispatch_engine.cpp'
      - 'cmake/PremiumPreview.cmake'
      - 'CMakeLists.txt'
      - 'src/engine/**'
      - 'src/dsp/**'
      - 'experiments/**'
      - 'third_party/DaisySP'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k1-setup-fp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize pinned DSP source only
        run: git submodule update --init third_party/DaisySP
      - name: Configure offline Universal probes
        run: cmake -S . -B build-setup -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DSAWSTAR_BUILD_PLUGIN=OFF -DSAWSTAR_PREMIUM_PREVIEW=ON -DSAWSTAR_NUMERICAL_TRACE=OFF '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build separate setup observer and shared-timeline engine control
        run: cmake --build build-setup --target sawstar_k1_setup_fp_probe sawstar_premium_native_pair --parallel 3
      - name: Fixed per-architecture controls and setup modes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, hashlib, io, itertools, json, platform, subprocess
          out = Path('k1-setup-fp'); out.mkdir()
          probe = Path('build-setup/sawstar_k1_setup_fp_probe').resolve()
          pair = Path('build-setup/sawstar_premium_native_pair').resolve()
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest = dict(schema=1, state='incomplete', passive=True, fp_override=False,
              source_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              purpose='Setup IE localization in a new executable, not K1 root-cause proof',
              os_version=subprocess.check_output(['sw_vers'],text=True),
              host_architecture=platform.machine(),
              compiler=subprocess.check_output(['c++','--version'],text=True),
              probe_sha256=sha(probe), pair_sha256=sha(pair),
              cache_sha256=sha(Path('build-setup/CMakeCache.txt')), results=[])
          def save():
              (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          def fields(line):
              return dict(item.split('=',1) for item in line.split()[1:])
          expected_names = ['Reset','SetParameters','SetOutputBoost','SetSaw','SetOsc2',
              'SetMixer','SetFilter','SetFilterCharacter','SetFilterEnvelope','SetVoiceMode',
              'SetPerformance','SetLfo','SetLfo2','SetModulation','SetModulation',
              'SetModulation','SetWaveforms']+['Midi']*16
          def inspect(text, name, arch):
              lines = text.splitlines()
              if name == 'pair-self-test':
                  if 'Passive FP observation self-test passed' not in text:
                      raise ValueError('Missing existing FP self-test')
                  return {}
              if name == 'probe-self-test':
                  if 'Setup FP probe self-test PASS' not in text:
                      raise ValueError('Missing setup self-test')
                  return {}
              if name == 'pair-grid':
                  reader = csv.DictReader(io.StringIO(text)); rows = list(reader)
                  header = ['waveform','rate','filter_mode','voice_mode','fx',
                      'output_peak_error','output_relative_rms','prefx_peak_error','prefx_relative_rms']
                  if reader.fieldnames != header or len(rows)!=120:
                      raise ValueError('Incomplete shared-timeline control grid')
                  keys = [tuple(r[k] for k in header[:5]) for r in rows]
                  expected = list(itertools.product(('2',),('48000','96000','176400','192000','384000'),
                      ('0','1','2','3'),('0','1','2'),('0','1')))
                  if keys != expected or any(None in r or any(r[k]!='0' for k in header[5:]) for r in rows):
                      raise ValueError('Invalid shared-timeline control grid')
                  return dict(validated_cases=120)
              expected_order = 'candidate-reference' if name=='candidate-first' else 'reference-candidate'
              head = fields(lines[0])
              if (head.get('state')!='complete' or head.get('schema')!='1' or
                  head.get('passive')!='true' or head.get('order')!=expected_order or
                  head.get('mode')!=('coarse' if name=='coarse' else 'observed') or
                  any(head.get(k)!=v for k,v in dict(waveform='2',rate='48000',filter='0',
                      voice='0',fx='0',steps_per_engine='33',rendered_frames='4').items()) or
                  'setup_probe_audio_identity PASS' not in lines):
                  raise ValueError('Incomplete setup probe')
              snapshots = [fields(line) for line in lines if ' mxcsr_available=' in line]
              if not snapshots:
                  raise ValueError('Missing FP snapshots')
              for s in snapshots:
                  if s['mxcsr_available'] != ('1' if arch=='x86_64' else '0'):
                      raise ValueError('Incorrect MXCSR availability')
                  if arch=='x86_64':
                      raw = int(s['raw'],16)
                      if int(s['status'],16)!=(raw&0x3f) or int(s['controls'],16)!=(raw&0xffc0):
                          raise ValueError('Inconsistent FP snapshot')
                  elif (s['raw'],s['status'],s['controls'])!=('NA','NA','NA'):
                      raise ValueError('Unsupported MXCSR must be NA')
              operations=[]
              for i,line in enumerate(lines):
                  if line.startswith('setup_operation '):
                      op=fields(line)
                      if not lines[i+1].startswith('before ') or not lines[i+2].startswith('after '):
                          raise ValueError('Missing operation boundary')
                      op.update(before=fields(lines[i+1]),after=fields(lines[i+2]))
                      operations.append(op)
              if name=='coarse':
                  if operations: raise ValueError('Coarse mode contains per-operation reads')
              else:
                  order=['candidate','reference'] if name=='candidate-first' else ['reference','candidate']
                  actual=[(op['engine'],int(op['index']),op['name']) for op in operations]
                  expected=[(engine,i,label) for engine in order for i,label in enumerate(expected_names)]
                  if actual!=expected: raise ValueError('Incomplete or reordered operation trace')
              ie=[]; control_changes=[]
              for op in operations:
                  before,after=op['before'],op['after']
                  if arch=='x86_64' and not (int(before['status'],16)&1) and int(after['status'],16)&1:
                      ie.append(dict(engine=op['engine'],index=int(op['index']),name=op['name'],
                          before=before['raw'],after=after['raw']))
                  if before['controls']!=after['controls'] or before['c_rounding']!=after['c_rounding']:
                      control_changes.append(dict(engine=op['engine'],index=int(op['index']),name=op['name']))
              coarse_points={line.split()[0]:fields(line) for line in lines
                  if line.startswith(('case_begin ','objects_created ','reference_setup_','candidate_setup_'))}
              return dict(operation_rows=len(operations),new_ie_operations=ie,
                  operation_control_changes=control_changes,setup_boundaries=coarse_points,
                  observed_controls=sorted({s['controls'] for s in snapshots}),
                  observed_c_rounding=sorted({s['c_rounding'] for s in snapshots}))
          save()
          for arch in ('arm64','x86_64'):
              plan=[('pair-self-test',pair,['--fp-self-test']),
                  ('pair-grid',pair,['--waveform','2']),
                  ('probe-self-test',probe,['--self-test']),
                  ('coarse',probe,['--coarse']),('observed',probe,['--observe']),
                  ('candidate-first',probe,['--candidate-first'])]
              for name,exe,args in plan:
                  log=out/(arch+'-'+name+'.txt')
                  entry=dict(architecture=arch,name=name,arguments=args,log_file=log.name)
                  with log.open('w',encoding='utf-8') as stream:
                      try:
                          result=subprocess.run(['arch','-'+arch,str(exe)]+args,stdout=stream,
                              stderr=subprocess.STDOUT,timeout=120)
                          entry['returncode']=result.returncode
                      except subprocess.TimeoutExpired:
                          entry['returncode']=124
                          stream.write('\nSetup probe timeout\n')
                  entry['log_sha256']=sha(log)
                  if not entry['returncode']:
                      try:
                          entry.update(inspect(log.read_text(),name,arch))
                      except (ValueError,KeyError,IndexError) as error:
                          entry['validation_error']=str(error)
                  manifest['results'].append(entry); save()
                  print(arch,name,'exit',entry['returncode'],entry.get('validation_error',''),
                      'new_ie_operations',entry.get('new_ie_operations',[]),flush=True)
          failed=any(r['returncode'] or r.get('validation_error') for r in manifest['results'])
          if (sha(probe)!=manifest['probe_sha256'] or sha(pair)!=manifest['pair_sha256'] or
              sha(Path('build-setup/CMakeCache.txt'))!=manifest['cache_sha256']):
              manifest['error']='Probe executable/cache changed during campaign'; failed=True
          manifest['state']='failed' if failed else 'complete'; save()
          raise SystemExit(1 if failed else 0)
          PY
      - name: Preserve x86 disassembly for snapshot/code-generation review
        if: always()
        run: |
          mkdir -p k1-setup-fp
          otool -arch x86_64 -tvV build-setup/sawstar_k1_setup_fp_probe > k1-setup-fp/x86-disassembly.txt
      - name: Preserve probes, cache, snapshots and results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k1-setup-fp-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            k1-setup-fp/
            build-setup/sawstar_k1_setup_fp_probe
            build-setup/sawstar_premium_native_pair
            build-setup/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 90
