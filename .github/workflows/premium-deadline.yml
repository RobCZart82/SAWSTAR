name: Premium paired deadline research
on:
  pull_request:
    paths:
      - '.github/workflows/premium-deadline.yml'
      - 'CMakeLists.txt'
      - 'src/engine/**'
      - 'src/dsp/**'
      - 'experiments/premium_filter/**'
      - 'scripts/report-premium-deadline.py'
      - 'scripts/report-premium-drive.py'
      - 'tests/premium_drive_simd.cpp'
      - 'tests/premium_drive_rate_simd.cpp'
      - 'tests/premium_drive_rate_gain.cpp'
      - 'tests/premium_lookup_engine.cpp'
      - 'experiments/premium_filter/benchmark_tanh_deadline.cpp'
      - 'tests/premium_drive_complex.cpp'
      - 'tests/premium_deadline_report.py'
      - 'tests/premium_deadline_timeline.cpp'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: premium-deadline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    name: Premium deadline / ${{ matrix.study }} / ${{ matrix.workload || 'stationary-v1' }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            study: tanh
            target: sawstar_premium_tanh_deadline
            contract: premium_tanh_deadline_fixture
          - os: macos-14
            study: tanh
            target: sawstar_premium_tanh_deadline
            contract: premium_tanh_deadline_fixture
          - os: windows-2022
            study: simd-fir
            target: sawstar_premium_simd_deadline
            contract: premium_simd_deadline_fixture
          - os: macos-14
            study: simd-fir
            target: sawstar_premium_simd_deadline
            contract: premium_simd_deadline_fixture
          - os: windows-2022
            study: rate-simd-fir
            target: sawstar_premium_rate_simd_deadline
            contract: premium_rate_simd_deadline_fixture
          - os: macos-14
            study: rate-simd-fir
            target: sawstar_premium_rate_simd_deadline
            contract: premium_rate_simd_deadline_fixture
          - os: windows-2022
            study: gain-normalization
            target: sawstar_premium_gain_deadline
            contract: premium_gain_deadline_fixture
          - os: macos-14
            study: gain-normalization
            target: sawstar_premium_gain_deadline
            contract: premium_gain_deadline_fixture
          - os: windows-2022
            study: rate-gain-normalization
            target: sawstar_premium_rate_gain_deadline
            contract: premium_rate_gain_deadline_fixture
          - os: macos-14
            study: rate-gain-normalization
            target: sawstar_premium_rate_gain_deadline
            contract: premium_rate_gain_deadline_fixture
          - os: windows-2022
            study: rate-lookup
            target: sawstar_premium_lookup_deadline
            contract: premium_lookup_deadline_fixture
          - os: macos-14
            study: rate-lookup
            target: sawstar_premium_lookup_deadline
            contract: premium_lookup_deadline_fixture
          - os: windows-2022
            study: rate-lookup
            workload: modulated-v1
            target: sawstar_premium_lookup_deadline
            contract: premium_lookup_modulated_deadline_fixture
          - os: macos-14
            study: rate-lookup
            workload: modulated-v1
            target: sawstar_premium_lookup_deadline
            contract: premium_lookup_modulated_deadline_fixture
    env:
      SAWSTAR_PREMIUM_STUDY: ${{ matrix.study }}
      SAWSTAR_PREMIUM_WORKLOAD: ${{ matrix.workload || 'stationary-v1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize selected DSP dependency
        run: git submodule update --init third_party/DaisySP
      - name: Configure Release research probes
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSAWSTAR_CHECK_DAISYSP=ON
      - name: Build paired probe only
        run: cmake --build build --config Release --target ${{ matrix.target }} sawstar_premium_simd_tests sawstar_premium_rate_simd_tests sawstar_premium_rate_gain_tests sawstar_premium_gain_complex_tests sawstar_premium_deadline_timeline_tests --parallel 2
      - name: Validate sounding fixture and percentile controls
        run: ctest --test-dir build -C Release -R '^(premium_drive_simd_identity|premium_drive_rate_simd_identity|premium_drive_rate_gain_contract|premium_gain_complex_controls|premium_deadline_report|premium_deadline_timeline|${{ matrix.contract }})$' --verbose
      - name: Build lookup engine controls
        if: matrix.study == 'rate-lookup'
        run: cmake --build build --config Release --target sawstar_premium_lookup_engine_tests sawstar_premium_lookup_rate_tests sawstar_premium_lookup_complex_tests --parallel 2
      - name: Validate lookup modulation, routing and independent reference
        if: matrix.study == 'rate-lookup'
        run: ctest --test-dir build -C Release -R '^(premium_lookup_engine_modulation|premium_lookup_rate_contract|premium_lookup_complex_controls)$' --verbose | tee lookup-controls.txt
      - name: Record paired wall time distributions
        run: |
          deadline_arg=--deadline
          if [[ "$SAWSTAR_PREMIUM_WORKLOAD" == "modulated-v1" ]]; then
            deadline_arg=--deadline-modulated
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            build/Release/${{ matrix.target }}.exe "$deadline_arg" deadline-results
          else
            build/${{ matrix.target }} "$deadline_arg" deadline-results
          fi
      - name: Verify raw data and report paired ratios
        run: python scripts/report-premium-deadline.py deadline-results
      - name: Preserve lookup numerical control log
        if: matrix.study == 'rate-lookup'
        run: cp lookup-controls.txt deadline-results/lookup-controls.txt
      - name: Measure isolated Drive cost
        if: matrix.study == 'rate-simd-fir'
        run: |
          python scripts/report-premium-drive.py --self-test
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            build/Release/sawstar_premium_simd_tests.exe --benchmark > deadline-results/drive.csv
          else
            build/sawstar_premium_simd_tests --benchmark > deadline-results/drive.csv
          fi
          python scripts/report-premium-drive.py deadline-results
          cat deadline-results/drive.csv
      - name: Preserve compiler description
        run: |
          mkdir -p deadline-results/compiler
          find build/CMakeFiles -name CMakeCXXCompiler.cmake -exec cp '{}' deadline-results/compiler/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premium-deadline-${{ matrix.study }}-${{ matrix.workload || 'stationary-v1' }}-${{ matrix.os }}
          path: deadline-results/
          if-no-files-found: error
          retention-days: 90
