name: Build windows foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: windows-2022 / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check central release metadata
        run: python scripts/sync-release-metadata.py --check
      - name: Initialize only the MIT DaisySP core
        run: git submodule update --init third_party/DaisySP
      - name: Configure foundation and selected DSP checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTING=ON -DSAWSTAR_CHECK_DAISYSP=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Report source level and high-register measurements
        if: matrix.config == 'Release'
        run: ctest --test-dir build -C Release -R '^(source_quality|engine_audit)$' --verbose
      - name: Compare audio CPU and level measurements
        if: matrix.config == 'Release'
        run: python scripts/benchmark-audio.py

  vst3:
    name: VST3 / ${{ matrix.arch }} / Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      SAWSTAR_WINDOWS_ARCH: ${{ matrix.arch }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch pinned plugin dependencies
        run: python scripts/bootstrap-plugin.py
      - name: Configure VST3 shell
        run: cmake -S . -B build-plugin -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release -DSAWSTAR_BUILD_PLUGIN=ON -DBUILD_TESTING=ON -DIPLUG_DEPLOY_PLUGINS=OFF
      - name: Build VST3 and parameter checks
        run: cmake --build build-plugin --config Release --parallel 3
      - name: Test foundation
        run: ctest --test-dir build-plugin -C Release --output-on-failure
      - name: Validate VST3 factory, processing and state
        run: python scripts/validate-plugin.py
      - name: Package candidate, manuals and notices
        run: python scripts/package-plugin.py build-plugin/out SAWSTAR-windows.zip
      - name: Audit architecture and static runtime
        shell: pwsh
        run: |
          $folder = if ('${{ matrix.arch }}' -eq 'ARM64') { 'arm64-win' } else { 'x86_64-win' }
          python scripts/check-windows-runtime.py "build-plugin/out/SAWSTAR.vst3/Contents/$folder/SAWSTAR.vst3" '${{ matrix.arch }}'
      - name: Build Windows installer
        run: ./scripts/package-windows.ps1 -Archive SAWSTAR-windows.zip -Arch ${{ matrix.arch }}
      - name: Test installer and uninstaller on disposable runner
        run: ./scripts/test-windows-installer.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SAWSTAR-windows-${{ matrix.arch }}-candidate
          path: |
            SAWSTAR-windows.zip
            SAWSTAR-windows.zip.sha256
            dist/*Setup.exe
            dist/*Setup.exe.sha256
          if-no-files-found: error
