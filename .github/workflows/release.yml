name: Prepare verified release draft
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release.json
      - .github/workflows/release.yml
      - scripts/publish-release.py
      - scripts/release_draft.py
      - scripts/release_validation.py
      - docs/RELEASE_NOTES_*.md
permissions:
  contents: write
  actions: read
concurrency:
  group: sawstar-final-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify matching builds and prepare complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/publish-release.py
