name: K1 original binary replay
on:
  pull_request:
    paths:
      - '.github/workflows/k1-original-replay.yml'
      - 'scripts/replay-k1-original.py'
      - 'tests/k1_original_replay.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: k1-original-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parser:
    name: Replay evidence rejection controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate original-command and evidence rejection contracts
        run: python3 tests/k1_original_replay.py
  replay:
    name: Archived ${{ matrix.origin }} / macOS 14
    needs: parser
    runs-on: macos-14
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        origin: [candidate, reference]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download only the pinned historical artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_ORIGIN: ${{ matrix.origin }}
        run: |
          mkdir original-download
          case "$REPLAY_ORIGIN" in
            candidate) artifact=12186151118 ;;
            reference) artifact=12185332231 ;;
            *) exit 1 ;;
          esac
          gh api --hostname github.com "repos/RobCZart82/SAWSTAR/actions/artifacts/$artifact/zip" > original-download/original.zip
      - name: Verify provenance and replay the fixed historical process plan
        env:
          REPLAY_ORIGIN: ${{ matrix.origin }}
        run: python3 scripts/replay-k1-original.py --archive original-download/original.zip --origin "$REPLAY_ORIGIN" --output k1-original-replay
      - name: Preserve original archives, executable, cache and every replay result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k1-original-replay-${{ matrix.origin }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            k1-original-replay/
            original-download/
          if-no-files-found: warn
          retention-days: 90
