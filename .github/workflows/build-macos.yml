name: Build macos foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: macos-14 / ${{ matrix.config }}
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize only the MIT DaisySP core
        run: git submodule update --init third_party/DaisySP
      - name: Configure foundation and selected DSP checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTING=ON -DSAWSTAR_CHECK_DAISYSP=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Report source level and high-register measurements
        if: matrix.config == 'Release'
        run: ctest --test-dir build -C Release -R '^(source_quality|engine_audit)$' --verbose
      - name: Compare audio CPU and level measurements
        if: matrix.config == 'Release'
        run: python scripts/benchmark-audio.py

  vst3:
    name: VST3 Universal / Release
    env:
      SAWSTAR_MAC_ARCHS: "arm64;x86_64"
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch pinned plugin dependencies
        run: python scripts/bootstrap-plugin.py
      - name: Configure VST3 shell
        run: cmake -S . -B build-plugin "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_BUILD_TYPE=Release -DSAWSTAR_BUILD_PLUGIN=ON -DBUILD_TESTING=ON -DIPLUG_DEPLOY_PLUGINS=OFF
      - name: Build VST3 and parameter checks
        run: cmake --build build-plugin --config Release --parallel 3
      - name: Test foundation
        run: ctest --test-dir build-plugin -C Release --output-on-failure
      - name: Validate VST3 factory, processing and state
        run: python scripts/validate-plugin.py
      - name: Package candidate, manuals and notices
        run: python scripts/package-plugin.py build-plugin/out SAWSTAR-macos.zip
      - name: Verify Universal slices and build candidate installer
        run: |
          lipo -verify_arch arm64 x86_64 build-plugin/out/SAWSTAR.vst3/Contents/MacOS/SAWSTAR
          python scripts/package-macos.py build-plugin/out/SAWSTAR.vst3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SAWSTAR-macos-universal-candidate
          path: |
            SAWSTAR-macos.zip
            SAWSTAR-macos.zip.sha256
            dist/*.pkg
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
