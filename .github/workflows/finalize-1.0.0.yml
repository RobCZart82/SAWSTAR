name: Finalize verified 1.0.0 draft
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-1.0.0.yml]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Verify uploaded draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import subprocess,json,os,pathlib,hashlib
          def gh(*a):return subprocess.check_output(['gh',*a],text=True)
          repo=os.environ['GH_REPO'];sha='2be19e06e129887b198915137af26063ee5ae513'
          for run in [34602316127,34602315886]:
            r=json.loads(gh('api',f'repos/{repo}/actions/runs/{run}'))
            assert r['head_sha']==sha and r['conclusion']=='success'
          drafts=json.loads(gh('api',f'repos/{repo}/releases'))
          r=next(x for x in drafts if x['tag_name']=='v1.0.0')
          assert r['draft'] and r['target_commitish']==sha
          expected={'SAWSTAR-1.0.0-macOS-Universal.dmg','SAWSTAR-1.0.0-macOS-Universal.pkg','SAWSTAR-1.0.0-Windows-x64-Setup.exe','SAWSTAR-1.0.0-Windows-ARM64-Setup.exe','SAWSTAR-1.0.0-macOS-Universal-Manual.zip','SAWSTAR-1.0.0-Windows-x64-Manual.zip','SAWSTAR-1.0.0-Windows-ARM64-Manual.zip','SHA256SUMS.txt'}
          assert {a['name'] for a in r['assets']}==expected
          gh('release','download','v1.0.0','--dir','verify')
          sums=pathlib.Path('verify/SHA256SUMS.txt').read_text().splitlines()
          assert len(sums)==7
          for line in sums:
            digest,name=line.split('  ',1)
            assert name in expected and name!='SHA256SUMS.txt'
            assert hashlib.sha256((pathlib.Path('verify')/name).read_bytes()).hexdigest()==digest
          gh('api','--method','PATCH',f"repos/{repo}/releases/{r['id']}",'-F','draft=false','-f','make_latest=true')
          print('Published SAWSTAR 1.0.0')
